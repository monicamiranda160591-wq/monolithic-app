# ============================================================
# Configuracion de la aplicacion - producto-app
# ============================================================

spring.application.name=producto-app

# ============================================================
# Configuracion de la base de datos H2 en memoria
# ============================================================
spring.datasource.url=jdbc:h2:mem:productosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.pool-name=ProductosPool
spring.datasource.hikari.maximum-pool-size=5

# Consola H2 (solo para desarrollo/pruebas locales)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Configuracion JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Ejecutar data.sql despues de que Hibernate cree las tablas
spring.sql.init.mode=always

# ============================================================
# Configuracion del servidor
# ============================================================
server.port=8080
server.servlet.context-path=/

# ============================================================
# Actuator (health checks para CI/CD)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=producto-app
info.app.version=1.0.0-SNAPSHOT
info.app.description=Aplicacion monolitica de gestion de productos

# ============================================================
# Logging
# ============================================================
logging.level.com.example.productos=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
